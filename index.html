<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fredrikshald 1900</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15181c; --panel:#1c2126; --panel-2:#242a30;
    --paper:#efe7d6; --paper-dim:#c9c0ae;
    --signal:#c2452d; --signal-2:#e0a33c;
    --line:rgba(239,231,214,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--ink);color:var(--paper);display:flex}
  #map{flex:1;height:100vh;background:#0f1214}
  aside{width:360px;height:100vh;flex-shrink:0;background:var(--panel);
        border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  header{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--paper-dim);margin-top:4px;letter-spacing:.02em}

  .controls{padding:16px 22px;border-bottom:1px solid var(--line)}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--paper-dim);margin-bottom:8px}
  input[type=range]{width:100%;accent-color:var(--signal-2)}
  input[type=search]{width:100%;margin-top:14px;padding:9px 11px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--paper);font:inherit;font-size:13px}
  input[type=search]::placeholder{color:#6f7780}
  input:focus-visible,a:focus-visible{outline:2px solid var(--signal-2);outline-offset:1px}

  .body{flex:1;overflow-y:auto;padding:22px}
  #panelBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
  .empty{color:var(--paper-dim);font-size:14px;line-height:1.55}

  .top{padding:22px 22px 0;flex-shrink:0}
  .addr{font-family:Fraunces,serif;font-weight:600;font-size:22px;line-height:1.15;margin:0 0 2px}
  .undertittel{font-size:13px;color:var(--paper-dim);margin-bottom:4px}
  .eier-linje{font-size:13px;color:var(--paper);margin-bottom:2px}
  .eier-linje .etikett{color:var(--paper-dim)}
  .matr{font-size:11.5px;color:var(--signal-2);letter-spacing:.03em;margin-bottom:0;line-height:1.5}

  /* Faner */
  .tabs{display:flex;gap:0;padding:0 22px;flex-shrink:0;border-bottom:1px solid var(--line);margin-top:16px}
  .tab{padding:10px 0;margin-right:22px;font-size:12px;font-weight:500;letter-spacing:.04em;
       text-transform:uppercase;color:var(--paper-dim);cursor:pointer;border-bottom:2px solid transparent;
       transition:color .15s, border-color .15s;position:relative;top:1px}
  .tab:hover{color:var(--paper)}
  .tab.active{color:var(--signal-2);border-bottom-color:var(--signal-2)}
  .tab .teller{font-size:10px;font-weight:400;opacity:.6;margin-left:4px}

  /* Fane-innhold */
  .tab-content{display:none}
  .tab-content.active{display:block}
  .tab-inner{padding:18px 22px 22px}
  #panelBody .tab-content.active{flex:1}

  /* === BEBOERE-fane === */
  .oppsummering{font-size:12px;color:var(--paper-dim);padding-bottom:14px;border-bottom:1px solid var(--line);
                margin-bottom:2px;line-height:1.5}
  .silh{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .silh svg{display:block;width:auto;color:var(--paper)}
  .silh svg.v{height:26px}
  .silh svg.bn{height:18px}
  .silh svg.ukj{opacity:.42}
  .silh.tett{gap:2px}
  .silh.tett svg.v{height:18px}
  .silh.tett svg.bn{height:12px}

  details.hh{border-bottom:1px solid var(--line);padding:14px 0}
  details.hh:last-of-type{border-bottom:none}
  details.hh summary{cursor:pointer;list-style:none;position:relative;padding-right:20px}
  details.hh summary::-webkit-details-marker{display:none}
  details.hh summary::after{
    content:'';position:absolute;right:2px;top:50%;
    width:6px;height:6px;margin-top:-5px;
    border-right:1.5px solid var(--paper-dim);border-bottom:1.5px solid var(--paper-dim);
    transform:rotate(45deg);transition:transform .15s
  }
  details.hh[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
  details.hh summary:hover .hh-navn{color:var(--signal-2)}
  .hh-navn{font-family:Fraunces,serif;font-size:16px;line-height:1.2}
  .hh-under{font-size:12px;color:var(--paper-dim);margin-top:3px;line-height:1.4}
  details.hh[open] summary{margin-bottom:8px}

  .p{padding:7px 0;border-bottom:1px solid rgba(239,231,214,.07);font-size:13px;line-height:1.45}
  details.hh .p:last-of-type{border-bottom:none;padding-bottom:0}
  .p b{font-weight:500}
  .p span{color:var(--paper-dim)}
  .yrke{color:var(--signal-2)}

  .ingen-beboere{color:var(--paper-dim);font-size:13px;line-height:1.55;padding:16px 0}

  /* === EIENDOM-fane === */
  .felt-gruppe{margin-bottom:20px}
  .felt-gruppe:last-child{margin-bottom:0}
  .gruppe-tittel{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--paper-dim);
                 margin-bottom:10px;font-weight:500}
  .felt{display:flex;justify-content:space-between;align-items:baseline;
        padding:6px 0;border-bottom:1px solid rgba(239,231,214,.06);font-size:13px;line-height:1.45}
  .felt:last-child{border-bottom:none}
  .felt-etikett{color:var(--paper-dim);flex-shrink:0;margin-right:12px}
  .felt-verdi{text-align:right;color:var(--paper);font-variant-numeric:tabular-nums}
  .felt-verdi.stor{font-family:Fraunces,serif;font-size:15px;color:var(--signal-2)}

  .anmerkning{margin-top:16px;padding:12px 14px;background:rgba(239,231,214,.05);border-radius:4px;
              font-size:12.5px;line-height:1.55;color:var(--paper-dim);font-style:italic}

  /* === BYGNINGER-fane === */
  .bygg-hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .bygg-ikon{width:48px;height:48px;border-radius:4px;background:var(--panel-2);
             display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bygg-ikon svg{width:28px;height:28px;color:var(--signal-2)}
  .bygg-tekst{flex:1}
  .bygg-type{font-family:Fraunces,serif;font-size:17px;line-height:1.2;margin-bottom:4px}
  .bygg-detalj{font-size:12.5px;color:var(--paper-dim);line-height:1.5}

  .bygg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .bygg-kort{background:var(--panel-2);border-radius:4px;padding:12px 14px}
  .bygg-kort-verdi{font-family:Fraunces,serif;font-size:20px;line-height:1;margin-bottom:4px;color:var(--paper)}
  .bygg-kort-etikett{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-dim)}

  .bilde-placeholder{width:100%;aspect-ratio:16/10;border-radius:4px;background:var(--panel-2);
                      display:flex;align-items:center;justify-content:center;margin-top:4px}
  .bilde-placeholder span{font-size:12px;color:#6f7780}

  figure{margin:0 0 14px}
  figure img{width:100%;display:block;border-radius:4px}
  figcaption{font-size:11px;color:#6f7780;margin-top:6px;line-height:1.5}

  .historie{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
            font-size:13.5px;line-height:1.65;color:var(--paper)}
  .historie p{margin:0 0 .8em}
  .historie p:last-child{margin-bottom:0}

  /* Kilde-footer */
  .kilde{padding:14px 22px;border-top:1px solid var(--line);font-size:10.5px;color:#6f7780;line-height:1.6;flex-shrink:0}
  .kilde a{color:var(--signal-2)}

  .admin-bar{padding:10px 22px;border-top:1px solid var(--signal-2);background:var(--panel-2);display:none}
  body.admin .admin-bar{display:block}
  .admin-btn{background:var(--signal-2);color:var(--ink);border:none;padding:7px 14px;border-radius:3px;
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em;width:100%}
  .admin-btn:hover{filter:brightness(1.15)}
  .admin-btn.secondary{background:transparent;border:1px solid var(--signal-2);color:var(--signal-2)}
  .admin-edit{padding:14px 0}
  .admin-edit label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--paper-dim);margin-bottom:4px;margin-top:10px}
  .admin-edit label:first-child{margin-top:0}
  .admin-edit input[type=text],.admin-edit textarea{width:100%;padding:7px 9px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel);color:var(--paper);font:inherit;font-size:13px}
  .admin-edit textarea{min-height:60px;resize:vertical}
  .admin-badge{display:inline-block;background:var(--signal-2);color:var(--ink);font-size:9px;
    font-weight:600;padding:2px 6px;border-radius:2px;letter-spacing:.06em;margin-left:8px;vertical-align:middle}
  .admin-changes{font-size:11px;color:var(--signal-2);margin-top:6px}
  .leaflet-container{font-family:inherit}
  .baselag,.histlag{transition:filter .25s}
  body.sok .baselag,body.sok .histlag{filter:saturate(.25) brightness(1.05)}
  @media(max-width:860px){body{flex-direction:column-reverse}aside{width:100%;height:52vh}#map{height:48vh}}
</style>
</head>
<body>

<div id="map"></div>

<aside>
  <header>
    <h1>Fredrikshald 1900<span class="admin-badge" style="display:none" id="adminBadge">ADMIN</span></h1>
    <div class="sub">Folketellingen lagt over Krums bykart fra 1905</div>
  </header>

  <div class="controls">
    <label for="op">Historisk kart</label>
    <input type="range" id="op" min="0" max="100" value="75">
    <input type="search" id="sok" placeholder="Søk navn eller yrke">
  </div>

  <div id="panelTop"></div>
  <div id="panelTabs" style="display:none"></div>
  <div id="panelBody">
    <div class="body" id="panel">
      <p class="empty">Klikk på en gård for å se hvem som bodde der.</p>
    </div>
  </div>
  <div id="panelKilde" class="kilde" style="display:none"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const EPOST = 'din@epost.no';   // bytt ut

const map = L.map('map',{zoomControl:false}).setView([59.1240,11.3877],17);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxNativeZoom:19,maxZoom:21,className:'baselag',attribution:'© OpenStreetMap'
}).addTo(map);
const historisk = L.tileLayer('tiles/{z}/{x}/{y}.png',{
  minZoom:14,maxNativeZoom:19,maxZoom:21,opacity:.75,className:'histlag',attribution:'Historisk kart © Kartverket'
}).addTo(map);
document.getElementById('op').addEventListener('input',e=>historisk.setOpacity(e.target.value/100));

const SIL = {
  m:'<svg class="v" width="13" height="34" viewBox="0 0 13 34"><path fill="currentColor" d="M6.5 0a2.8 2.8 0 100 5.6A2.8 2.8 0 006.5 0zM3 6.6C1.4 6.6.6 7.8.6 9.4v8.2c0 .8.6 1.4 1.3 1.4h.5V33c0 .6.4 1 1 1h1.4c.5 0 .9-.4.9-1v-14h.6v14c0 .6.4 1 1 1H8c.6 0 1-.4 1-1V19h.5c.7 0 1.3-.6 1.3-1.4V9.4c0-1.6-.8-2.8-2.4-2.8H3z"/></svg>',
  k:'<svg class="v" width="14" height="34" viewBox="0 0 14 34"><path fill="currentColor" d="M7 0a2.8 2.8 0 100 5.6A2.8 2.8 0 007 0zM4.4 6.6c-1.4 0-2.2.9-2.6 2.3L.2 17c-.2.9.3 1.6 1.1 1.7.8.1 1.4-.3 1.6-1.1l.9-3.6v6.4l-1.1 1.6c-.2.4-.3.7-.3 1.1V33c0 .6.4 1 1 1h1.3c.5 0 .9-.4.9-1v-9h.8v9c0 .6.4 1 1 1h1.3c.5 0 .9-.4.9-1v-9.9c0-.4-.1-.7-.3-1.1L8.2 20.4V14l.9 3.6c.2.8.8 1.2 1.6 1.1.8-.1 1.3-.8 1.1-1.7L10.2 8.9c-.4-1.4-1.2-2.3-2.6-2.3H4.4z"/></svg>',
  b:'<svg class="bn" width="10" height="23" viewBox="0 0 10 23"><path fill="currentColor" d="M5 0a2.2 2.2 0 100 4.4A2.2 2.2 0 005 0zM2.6 5.2c-1.2 0-1.8.9-1.8 2v5.6c0 .6.4 1 1 1h.4v8.2c0 .5.4.9.8.9h1c.5 0 .8-.4.8-.9v-8.2h.4v8.2c0 .5.3.9.8.9h1c.5 0 .8-.4.8-.9V13.8h.4c.6 0 1-.4 1-1V7.2c0-1.1-.6-2-1.8-2H2.6z"/></svg>'
};
const alder = f => f ? 1900 - f : null;
function silhuett(b){
  const svg = (alder(b.f) !== null && alder(b.f) < 15) ? SIL.b
            : b.kj === 'k' ? SIL.k : SIL.m;
  // kj null = kjønn ikke bestemt i kilden. Tegnes dempet, ikke som mann.
  return b.kj ? svg : svg.replace('class="', 'class="ukj ');
}

const panel = document.getElementById('panel');
let beboere = {};        // id -> { husstander: [...] }
let eiendommer = {};     // id -> { navn, adresse, bygning, matrikkel_1901, ... }

/* Tittel på en husstand. Deler flertallet etternavn med den som fører
   husstanden, er det en familie. Ellers navngir vi bare husfar, siden
   «Wiel og 4» leser feil når de fire er tjenestefolk. */
function husstandTittel(h){
  const b = h.beboere;
  const hf = b.find(x => /^h[fm]/i.test(x.stilling || '')) || b[0];
  if (!hf) return 'Husstand';

  const etter = hf.navn.trim().split(/\s+/).slice(-1)[0];
  const deler = b.filter(x => x.navn.trim().split(/\s+/).slice(-1)[0] === etter).length;

  return (deler >= 2 && deler > b.length / 2) ? `Familien ${etter}` : hf.navn;
}

function husstandBlokk(h){
  const b = h.beboere;
  const hf = b.find(x => /^h[fm]/i.test(x.stilling || '')) || b[0];
  const barn = b.filter(x => alder(x.f) !== null && alder(x.f) < 15).length;
  const tett = b.length > 14 ? ' tett' : '';

  return `
    <details class="hh">
      <summary>
        <div class="silh${tett}">${b.map(silhuett).join('')}</div>
        <div class="hh-navn">${husstandTittel(h)}</div>
        <div class="hh-under">${hf && hf.yrke ? hf.yrke : ''}${hf && hf.yrke ? ' · ' : ''}${b.length} ${b.length === 1 ? 'person' : 'personer'}${barn ? ', ' + barn + ' barn' : ''}</div>
      </summary>
      ${b.map(x => `
        <div class="p">
          <b>${x.navn}</b><span>${x.f ? ', f. ' + x.f : ''}${x.stilling ? ' · ' + x.stilling : ''}</span>
          ${x.yrke ? `<br><span class="yrke">${x.yrke}</span>` : ''}
        </div>`).join('')}
    </details>`;
}

function vis(p){
  aktivParsell = p;
  const e = eiendommer[p.id] || {};
  const d = beboere[p.id];
  const hh = d ? d.husstander : [];
  const alle = hh.flatMap(h => h.beboere);
  const barn = alle.filter(b => alder(b.f) !== null && alder(b.f) < 15).length;
  const mat = e.matrikkel_1901 || {};
  const ft = e.folketelling_meta || {};
  const byg = e.bygning || {};

  /* Tittel-hierarki */
  const tittel = e.navn || mat.gate || e.adresse || ft.adresse_historisk || ('Løpenummer ' + p.id);
  const undertittel = (e.navn && mat.gate && e.navn !== mat.gate) ? mat.gate
                    : (!e.navn && e.adresse && e.adresse !== tittel) ? e.adresse : null;

  /* Nummerlinje */
  const nummerlinje = [
    p.id ? 'Lnr ' + p.id : null,
    mat.matrikkelnr || p.matrikkel ? 'Matrikkel ' + (mat.matrikkelnr || p.matrikkel) : null,
    e.gnr_bnr || p.gnr_bnr ? 'Gnr/bnr ' + (e.gnr_bnr || p.gnr_bnr) : null
  ].filter(Boolean).join(' · ') || '';

  /* === TOP === */
  const topEl = document.getElementById('panelTop');
  topEl.innerHTML = `
    <div class="top">
      <h2 class="addr">${tittel}</h2>
      ${undertittel ? `<div class="undertittel">${undertittel}</div>` : ''}
      ${mat.eier ? `<div class="eier-linje"><span class="etikett">Eier:</span> ${mat.eier}</div>` : ''}
      ${nummerlinje ? `<div class="matr">${nummerlinje}</div>` : ''}
    </div>`;

  /* === FANER === */
  const harBeboere = alle.length > 0;
  const startTab = harBeboere ? 'beboere' : 'eiendom';
  const tabsEl = document.getElementById('panelTabs');
  tabsEl.style.display = '';
  tabsEl.innerHTML = `
    <div class="tabs">
      <div class="tab${startTab==='beboere'?' active':''}" data-tab="beboere">Beboere${harBeboere ? '<span class="teller">' + alle.length + '</span>' : ''}</div>
      <div class="tab${startTab==='eiendom'?' active':''}" data-tab="eiendom">Eiendom</div>
      <div class="tab" data-tab="bygninger">Bygninger</div>
    </div>`;

  /* === BEBOERE === */
  const beboereSilh = harBeboere ? `
    <div class="oppsummering">
      <div class="silh${alle.length > 30 ? ' tett' : ''}">${alle.map(silhuett).join('')}</div>
      ${alle.length} personer i ${hh.length} ${hh.length === 1 ? 'husstand' : 'husstander'} · ${alle.length - barn} voksne, ${barn} barn
    </div>` : '';

  const beboereInnhold = harBeboere
    ? beboereSilh + hh.map(h => husstandBlokk(h)).join('')
    : '<p class="ingen-beboere">Ingen beboere registrert i folketellingen 1900.</p>';

  /* === EIENDOM === */
  let eiendomFelter = '';

  /* Matrikkelgruppe */
  const matFelter = [
    mat.eier ? ['Eier', mat.eier] : null,
    mat.gate ? ['Gate', mat.gate] : null,
    mat.matrikkelnr || p.matrikkel ? ['Matrikkelnr', mat.matrikkelnr || p.matrikkel] : null,
    p.id ? ['Løpenr 1901', p.id] : null,
    mat.lopenr_1878 || p.lopenr_1878 ? ['Løpenr 1878', mat.lopenr_1878 || p.lopenr_1878] : null,
    e.gnr_bnr || p.gnr_bnr ? ['Gnr/bnr', e.gnr_bnr || p.gnr_bnr] : null
  ].filter(Boolean);
  if (matFelter.length) {
    eiendomFelter += `<div class="felt-gruppe"><div class="gruppe-tittel">Matrikkel 1901</div>
      ${matFelter.map(f => `<div class="felt"><span class="felt-etikett">${f[0]}</span><span class="felt-verdi">${f[1]}</span></div>`).join('')}
    </div>`;
  }

  /* Takst */
  if (mat.skattetakst || mat.brandtakst) {
    eiendomFelter += `<div class="felt-gruppe"><div class="gruppe-tittel">Takst</div>
      ${mat.skattetakst ? `<div class="felt"><span class="felt-etikett">Skattetakst</span><span class="felt-verdi stor">${mat.skattetakst.toLocaleString('nb')} kr</span></div>` : ''}
      ${mat.brandtakst ? `<div class="felt"><span class="felt-etikett">Brandtakst</span><span class="felt-verdi stor">${mat.brandtakst.toLocaleString('nb')} kr</span></div>` : ''}
    </div>`;
  }

  /* Anmerkning */
  if (mat.anmerkning) {
    eiendomFelter += `<div class="anmerkning">${mat.anmerkning}</div>`;
  }

  /* Folketellingsgruppe */
  const ftFelter = [
    ft.adresse_historisk ? ['Historisk adresse', ft.adresse_historisk] : null,
    ft.krets ? ['Tellingskrets', ft.krets] : null,
    byg.gardens_nummer_raa ? ['Gårdens nummer', byg.gardens_nummer_raa] : null
  ].filter(Boolean);
  if (ftFelter.length) {
    eiendomFelter += `<div class="felt-gruppe" style="margin-top:20px"><div class="gruppe-tittel">Folketelling</div>
      ${ftFelter.map(f => `<div class="felt"><span class="felt-etikett">${f[0]}</span><span class="felt-verdi">${f[1]}</span></div>`).join('')}
    </div>`;
  }

  if (!eiendomFelter) eiendomFelter = '<p class="ingen-beboere">Ingen eiendomsdata registrert.</p>';

  /* === BYGNINGER === */
  const husIkon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>';
  let bygningerInnhold = '';

  if (byg.hustype || byg.etasjer || byg.leiligheter || byg.sidebygninger) {
    bygningerInnhold += `<div class="bygg-hero">
      <div class="bygg-ikon">${husIkon}</div>
      <div class="bygg-tekst">
        <div class="bygg-type">${byg.hustype || 'Bygning'}</div>
        ${byg.sidebygninger ? `<div class="bygg-detalj">${byg.sidebygninger}</div>` : ''}
      </div>
    </div>`;

    const kort = [
      byg.etasjer ? ['Etasjer', byg.etasjer] : null,
      byg.leiligheter ? ['Leiligheter', byg.leiligheter] : null
    ].filter(Boolean);
    if (kort.length) {
      bygningerInnhold += `<div class="bygg-grid">
        ${kort.map(k => `<div class="bygg-kort"><div class="bygg-kort-verdi">${k[1]}</div><div class="bygg-kort-etikett">${k[0]}</div></div>`).join('')}
      </div>`;
    }
  }

  /* Bilder */
  if (e.bilder && e.bilder.length) {
    bygningerInnhold += e.bilder.map(b => `
      <figure>
        <img src="${b.fil}" alt="${e.navn || e.adresse || ''}" loading="lazy">
        ${(b.kreditering || b.rettigheter) ? `<figcaption>${
          [b.kreditering, b.rettigheter].filter(Boolean).join(' · ')
        }${b.beskrivelse ? ' — ' + b.beskrivelse : ''}</figcaption>` : ''}
      </figure>`).join('');
  } else {
    bygningerInnhold += '<div class="bilde-placeholder"><span>Ingen bilder ennå</span></div>';
  }

  /* Historie */
  if (e.historie) {
    bygningerInnhold += `<div class="historie">${e.historie.split('\n\n').map(a => `<p>${a}</p>`).join('')}</div>`;
  }

  if (!bygningerInnhold) bygningerInnhold = '<p class="ingen-beboere">Ingen bygningsdata registrert.</p>';

  /* === PANEL BODY (tab contents) === */
  const bodyEl = document.getElementById('panelBody');
  bodyEl.innerHTML = `
    <div class="tab-content${startTab==='beboere'?' active':''}" data-content="beboere">
      <div class="tab-inner">${beboereInnhold}</div>
    </div>
    <div class="tab-content${startTab==='eiendom'?' active':''}" data-content="eiendom">
      <div class="tab-inner">${eiendomFelter}</div>
    </div>
    <div class="tab-content" data-content="bygninger">
      <div class="tab-inner">${bygningerInnhold}</div>
    </div>
    ${adminEditor(p)}`;

  /* === KILDE-FOOTER === */
  const emne = encodeURIComponent('Rettelse: ' + p.id + (e.adresse ? ' (' + e.adresse + ')' : ''));
  const kildeEl = document.getElementById('panelKilde');
  kildeEl.style.display = '';
  kildeEl.innerHTML = `
    ${d && d.kilde_url
      ? `Folketelling 1900 · <a href="${d.kilde_url}" target="_blank" rel="noopener">Digitalarkivet</a>`
      : 'Folketelling 1900 · Digitalarkivet'} · Arkivverket<br>
    Historisk kart 1905 ved O. Krum · ©Kartverket<br>
    <a href="mailto:${EPOST}?subject=${emne}">Meld feil</a>`;

  /* Tab-switching */
  tabsEl.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const id = tab.dataset.tab;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      bodyEl.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      bodyEl.querySelector('[data-content="' + id + '"]').classList.add('active');
    });
  });
}

/* Kartet er allerede rødt og gult, så konturene bruker lyshet framfor kulør:
   mørk strek med hvit casing under leser på gult papir, rød mur og blått vann. */
const stil   = {color:'#15181c',weight:1.2,opacity:.7,fillColor:'#15181c',fillOpacity:.06};
const valgt  = {color:'#15181c',weight:2.6,opacity:1,fillColor:'#e0a33c',fillOpacity:.30};
const dimmet = {color:'#15181c',weight:.8,opacity:.2,fillColor:'#15181c',fillOpacity:.02};
const treff  = {color:'#15181c',weight:2.2,opacity:1,fillColor:'#e0a33c',fillOpacity:.28};
let forrige = null, lag = null;

/* Hvit linje bak den valgte bygningen. Egen layer, ikke setStyle, siden
   Leaflet ikke kan tegne to strekbredder på samme polygon. */
let casing = null;
function settCasing(l){
  if (casing){ map.removeLayer(casing); casing = null; }
  if (!l) return;
  casing = L.polygon(l.getLatLngs(),
    {color:'#fff',weight:6,opacity:.9,fill:false,interactive:false}).addTo(map);
  l.bringToFront();
}

function tekstFor(id){
  const d = beboere[id];
  const e = eiendommer[id] || {};
  const personTekst = d ? d.husstander.flatMap(h => h.beboere)
    .map(b => (b.navn||'') + ' ' + (b.yrke||'')).join(' ') : '';
  const eierTekst = e.matrikkel_1901 ? (e.matrikkel_1901.eier || '') : '';
  return (personTekst + ' ' + eierTekst + ' ' + (e.navn || '')).toLowerCase();
}

async function start(){
  let geo, folk = {};
  try {
    geo = await (await fetch('parseller.geojson')).json();
  } catch(e) {
    panel.innerHTML = '<p class="empty">Fant ikke parseller.geojson. Filen må ligge ved siden av index.html, og siden må serveres over http (kjør <code>python -m http.server</code>), ikke åpnes direkte fra disk.</p>';
    return;
  }
  try { folk = await (await fetch('beboere.json')).json(); } catch(e) { /* valgfri */ }
  beboere = folk;
  try { eiendommer = await (await fetch('eiendommer.json')).json(); } catch(e) { /* valgfri */ }

  lag = L.geoJSON(geo,{
    style: stil,
    onEachFeature: (f,l) => {
      const p = f.properties;
      l.on('click', () => {
        if (forrige) forrige.setStyle(stil);
        l.setStyle(valgt); settCasing(l); forrige = l; vis(p);
      });
      l.on('mouseover', () => { if (l !== forrige) l.setStyle({fillOpacity:.32}); });
      l.on('mouseout',  () => { if (l !== forrige) l.setStyle(stil); });
      const e = eiendommer[p.id] || {};
      const ft = e.folketelling_meta || {};
      const mat = e.matrikkel_1901 || {};
      l.bindTooltip(e.navn || mat.gate || e.adresse || p.adresse || p.navn || ft.adresse_historisk || ('Løpenummer ' + p.id),
                    {direction:'top', opacity:.9});
    }
  }).addTo(map);

  map.fitBounds(lag.getBounds(), {padding:[30,30]});
}

document.getElementById('sok').addEventListener('input', e => {
  if (!lag) return;
  const q = e.target.value.trim().toLowerCase();
  document.body.classList.toggle('sok', !!q);   // demper kartet, så treffene løftes fram
  lag.eachLayer(l => {
    if (!q) { l.setStyle(l === forrige ? valgt : stil); return; }
    const p = l.feature.properties;
    const ei = eiendommer[p.id] || {};
    const eiMat = ei.matrikkel_1901 || {};
    const hay = tekstFor(p.id) + ' ' + (eiMat.gate||'') + ' ' + (ei.adresse||p.adresse||'') + ' ' + (ei.navn||p.navn||'');
    l.setStyle(hay.toLowerCase().includes(q) ? treff : dimmet);
  });
});

/* ---- Admin-modus ---- */
const ADMIN_PASS = 'fredrikshald1900';
let adminMode = false;
let adminEndringer = {};   // id -> { felt: nyVerdi, ... }
let aktivParsell = null;   // properties fra sist klikket parsell

function sjekkAdmin(){
  if (new URLSearchParams(location.search).has('admin')){
    const pw = prompt('Admin-passord:');
    if (pw === ADMIN_PASS){
      adminMode = true;
      document.body.classList.add('admin');
      document.getElementById('adminBadge').style.display = '';
    }
  }
}

function adminEditor(p){
  if (!adminMode) return '';
  const e = eiendommer[p.id] || {};
  const mat = e.matrikkel_1901 || {};
  const ft = e.folketelling_meta || {};
  const endret = adminEndringer[p.id] || {};
  const val = (felt, fallback) => endret[felt] !== undefined ? endret[felt] : (fallback || '');

  return `
    <div class="admin-edit" style="border-top:1px solid var(--signal-2);margin-top:18px;padding-top:14px">
      <div style="font-size:11px;color:var(--signal-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">Rediger</div>
      <label>Navn (f.eks. Wielgården)</label>
      <input type="text" data-felt="navn" value="${val('navn', e.navn || '')}">
      <label>Adresse</label>
      <input type="text" data-felt="adresse" value="${val('adresse', e.adresse || mat.gate || '')}">
      <label>Gnr/bnr</label>
      <input type="text" data-felt="gnr_bnr" value="${val('gnr_bnr', e.gnr_bnr || '')}">
      <button class="admin-btn" style="margin-top:12px" onclick="lagreEndring('${p.id}')">Lagre</button>
    </div>`;
}

function lagreEndring(id){
  const inputs = document.getElementById('panelBody').querySelectorAll('.admin-edit input[data-felt], .admin-edit textarea[data-felt]');
  const endring = {};
  inputs.forEach(inp => { if (inp.value.trim()) endring[inp.dataset.felt] = inp.value.trim(); });
  if (Object.keys(endring).length === 0) return;

  adminEndringer[id] = Object.assign(adminEndringer[id] || {}, endring);

  // Oppdater eiendommer i minnet så visningen reflekterer endringen
  if (!eiendommer[id]) eiendommer[id] = {};
  Object.assign(eiendommer[id], endring);

  // Oppdater tooltip
  if (lag) lag.eachLayer(l => {
    if (l.feature && l.feature.properties.id === id){
      const e = eiendommer[id] || {};
      const mat = e.matrikkel_1901 || {};
      l.unbindTooltip();
      l.bindTooltip(e.navn || mat.gate || e.adresse || ('Løpenummer ' + id), {direction:'top', opacity:.9});
    }
  });

  // Vis oppdatert panel
  if (aktivParsell && aktivParsell.id === id) vis(aktivParsell);
  oppdaterEksportKnapp();
}

function oppdaterEksportKnapp(){
  const n = Object.keys(adminEndringer).length;
  let bar = document.getElementById('adminBar');
  if (!bar){
    bar = document.createElement('div');
    bar.className = 'admin-bar';
    bar.id = 'adminBar';
    document.querySelector('aside').appendChild(bar);
  }
  bar.innerHTML = `
    <div class="admin-changes">${n} ${n === 1 ? 'gård' : 'gårder'} endret</div>
    <button class="admin-btn" style="margin-top:6px" onclick="eksporterEndringer()">Last ned eiendommer.json</button>`;
  bar.style.display = n > 0 ? 'block' : 'none';
}

function eksporterEndringer(){
  // Lag oppdatert eiendommer.json
  const data = JSON.stringify(eiendommer, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'eiendommer.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

sjekkAdmin();
start();
</script>
