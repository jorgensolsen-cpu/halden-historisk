<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fredrikshald 1900</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15181c; --panel:#1c2126; --panel-2:#242a30;
    --paper:#efe7d6; --paper-dim:#c9c0ae;
    --signal:#c2452d; --signal-2:#e0a33c;
    --line:rgba(239,231,214,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--ink);color:var(--paper);display:flex}
  #map{flex:1;height:100vh;background:#0f1214}
  aside{width:360px;height:100vh;flex-shrink:0;background:var(--panel);
        border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  header{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--paper-dim);margin-top:4px;letter-spacing:.02em}

  .controls{padding:16px 22px;border-bottom:1px solid var(--line)}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--paper-dim);margin-bottom:8px}
  input[type=range]{width:100%;accent-color:var(--signal-2)}
  input[type=search]{width:100%;margin-top:14px;padding:9px 11px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--paper);font:inherit;font-size:13px}
  input[type=search]::placeholder{color:#6f7780}
  input:focus-visible,a:focus-visible{outline:2px solid var(--signal-2);outline-offset:1px}

  .body{flex:1;overflow-y:auto;padding:22px}
  .empty{color:var(--paper-dim);font-size:14px;line-height:1.55}

  .addr{font-family:Fraunces,serif;font-size:22px;line-height:1.15;margin:0 0 2px}
  .navn{font-size:13px;color:var(--paper-dim);margin-bottom:10px}
  .matr{font-size:12px;color:var(--signal-2);letter-spacing:.04em;margin-bottom:18px}

  .hus{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
  .hus-type{font-size:13.5px;color:var(--paper);line-height:1.45}
  .count{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
         color:var(--paper-dim);padding:4px 0 0}

  .silh{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .silh svg{display:block;width:auto;color:var(--paper)}
  .silh svg.v{height:26px}
  .silh svg.bn{height:18px}
  .silh svg.ukj{opacity:.42}
  .silh.tett{gap:2px}
  .silh.tett svg.v{height:18px}
  .silh.tett svg.bn{height:12px}

  details.hh{border-bottom:1px solid var(--line);padding:14px 0}
  details.hh summary{cursor:pointer;list-style:none;position:relative;padding-right:20px}
  details.hh summary::-webkit-details-marker{display:none}
  details.hh summary::after{
    content:'';position:absolute;right:2px;top:50%;
    width:6px;height:6px;margin-top:-5px;
    border-right:1.5px solid var(--paper-dim);border-bottom:1.5px solid var(--paper-dim);
    transform:rotate(45deg);transition:transform .15s
  }
  details.hh[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
  details.hh summary:hover .hh-navn{color:var(--signal-2)}
  .hh-navn{font-family:Fraunces,serif;font-size:16px;line-height:1.2}
  .hh-under{font-size:12px;color:var(--paper-dim);margin-top:3px;line-height:1.4}
  details.hh[open] summary{margin-bottom:8px}

  .p{padding:7px 0;border-bottom:1px solid rgba(239,231,214,.07);font-size:13px;line-height:1.45}
  details.hh .p:last-of-type{border-bottom:none;padding-bottom:0}
  .p b{font-weight:500}
  .p span{color:var(--paper-dim)}
  .yrke{color:var(--signal-2)}

  figure{margin:0 0 18px}
  figure img{width:100%;display:block;border-radius:2px}
  figcaption{font-size:11px;color:#6f7780;margin-top:6px;line-height:1.5}

  .historie{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
            font-size:13.5px;line-height:1.65;color:var(--paper)}
  .historie p{margin:0 0 .8em}
  .historie p:last-child{margin-bottom:0}

  .ingen{color:var(--paper-dim);font-size:13px;line-height:1.55;padding:16px 0}
  .meta{margin-top:24px;font-size:11px;color:#6f7780;line-height:1.6}
  .meta a{color:var(--signal-2)}
  .leaflet-container{font-family:inherit}
  .baselag,.histlag{transition:filter .25s}
  body.sok .baselag,body.sok .histlag{filter:saturate(.25) brightness(1.05)}
  @media(max-width:860px){body{flex-direction:column-reverse}aside{width:100%;height:52vh}#map{height:48vh}}
</style>
</head>
<body>

<div id="map"></div>

<aside>
  <header>
    <h1>Fredrikshald 1900</h1>
    <div class="sub">Folketellingen lagt over Krums bykart fra 1905</div>
  </header>

  <div class="controls">
    <label for="op">Historisk kart</label>
    <input type="range" id="op" min="0" max="100" value="75">
    <input type="search" id="sok" placeholder="Søk navn eller yrke">
  </div>

  <div class="body" id="panel">
    <p class="empty">Klikk på en gård for å se hvem som bodde der.</p>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const EPOST = 'din@epost.no';   // bytt ut

const map = L.map('map',{zoomControl:false}).setView([59.1240,11.3877],17);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxNativeZoom:19,maxZoom:21,className:'baselag',attribution:'© OpenStreetMap'
}).addTo(map);
const historisk = L.tileLayer('tiles/{z}/{x}/{y}.png',{
  minZoom:14,maxNativeZoom:19,maxZoom:21,opacity:.75,className:'histlag',attribution:'Historisk kart © Kartverket'
}).addTo(map);
document.getElementById('op').addEventListener('input',e=>historisk.setOpacity(e.target.value/100));

const SIL = {
  m:'<svg class="v" width="13" height="34" viewBox="0 0 13 34"><path fill="currentColor" d="M6.5 0a2.8 2.8 0 100 5.6A2.8 2.8 0 006.5 0zM3 6.6C1.4 6.6.6 7.8.6 9.4v8.2c0 .8.6 1.4 1.3 1.4h.5V33c0 .6.4 1 1 1h1.4c.5 0 .9-.4.9-1v-14h.6v14c0 .6.4 1 1 1H8c.6 0 1-.4 1-1V19h.5c.7 0 1.3-.6 1.3-1.4V9.4c0-1.6-.8-2.8-2.4-2.8H3z"/></svg>',
  k:'<svg class="v" width="14" height="34" viewBox="0 0 14 34"><path fill="currentColor" d="M7 0a2.8 2.8 0 100 5.6A2.8 2.8 0 007 0zM4.4 6.6c-1.4 0-2.2.9-2.6 2.3L.2 17c-.2.9.3 1.6 1.1 1.7.8.1 1.4-.3 1.6-1.1l.9-3.6v6.4l-1.1 1.6c-.2.4-.3.7-.3 1.1V33c0 .6.4 1 1 1h1.3c.5 0 .9-.4.9-1v-9h.8v9c0 .6.4 1 1 1h1.3c.5 0 .9-.4.9-1v-9.9c0-.4-.1-.7-.3-1.1L8.2 20.4V14l.9 3.6c.2.8.8 1.2 1.6 1.1.8-.1 1.3-.8 1.1-1.7L10.2 8.9c-.4-1.4-1.2-2.3-2.6-2.3H4.4z"/></svg>',
  b:'<svg class="bn" width="10" height="23" viewBox="0 0 10 23"><path fill="currentColor" d="M5 0a2.2 2.2 0 100 4.4A2.2 2.2 0 005 0zM2.6 5.2c-1.2 0-1.8.9-1.8 2v5.6c0 .6.4 1 1 1h.4v8.2c0 .5.4.9.8.9h1c.5 0 .8-.4.8-.9v-8.2h.4v8.2c0 .5.3.9.8.9h1c.5 0 .8-.4.8-.9V13.8h.4c.6 0 1-.4 1-1V7.2c0-1.1-.6-2-1.8-2H2.6z"/></svg>'
};
const alder = f => f ? 1900 - f : null;
function silhuett(b){
  const svg = (alder(b.f) !== null && alder(b.f) < 15) ? SIL.b
            : b.kj === 'k' ? SIL.k : SIL.m;
  // kj null = kjønn ikke bestemt i kilden. Tegnes dempet, ikke som mann.
  return b.kj ? svg : svg.replace('class="', 'class="ukj ');
}

const panel = document.getElementById('panel');
let beboere = {};        // id -> { husstander: [...] }
let eiendommer = {};     // id -> { navn, adresse, bygning, matrikkel_1901, ... }

/* Tittel på en husstand. Deler flertallet etternavn med den som fører
   husstanden, er det en familie. Ellers navngir vi bare husfar, siden
   «Wiel og 4» leser feil når de fire er tjenestefolk. */
function husstandTittel(h){
  const b = h.beboere;
  const hf = b.find(x => /^h[fm]/i.test(x.stilling || '')) || b[0];
  if (!hf) return 'Husstand';

  const etter = hf.navn.trim().split(/\s+/).slice(-1)[0];
  const deler = b.filter(x => x.navn.trim().split(/\s+/).slice(-1)[0] === etter).length;

  return (deler >= 2 && deler > b.length / 2) ? `Familien ${etter}` : hf.navn;
}

function husstandBlokk(h, i, antall){
  const b = h.beboere;
  const hf = b.find(x => /^h[fm]/i.test(x.stilling || '')) || b[0];
  const barn = b.filter(x => alder(x.f) !== null && alder(x.f) < 15).length;
  const tett = b.length > 14 ? ' tett' : '';

  return `
    <details class="hh">
      <summary>
        <div class="silh${tett}">${b.map(silhuett).join('')}</div>
        <div class="hh-navn">${husstandTittel(h)}</div>
        <div class="hh-under">${hf && hf.yrke ? hf.yrke : ''}${hf && hf.yrke ? ' · ' : ''}${b.length} ${b.length === 1 ? 'person' : 'personer'}${barn ? ', ' + barn + ' barn' : ''}</div>
      </summary>
      ${b.map(x => `
        <div class="p">
          <b>${x.navn}</b><span>${x.f ? ', f. ' + x.f : ''}${x.stilling ? ' · ' + x.stilling : ''}</span>
          ${x.yrke ? `<br><span class="yrke">${x.yrke}</span>` : ''}
        </div>`).join('')}
    </details>`;
}

function vis(p){
  const e = eiendommer[p.id] || {};   // eiendomsdata
  const d = beboere[p.id];            // folketellingsdata
  const hh = d ? d.husstander : [];
  const alle = hh.flatMap(h => h.beboere);
  const barn = alle.filter(b => alder(b.f) !== null && alder(b.f) < 15).length;

  const emne = encodeURIComponent('Rettelse: ' + p.id + (e.adresse ? ' (' + e.adresse + ')' : ''));

  /* Bilder fra eiendommer.json (array) */
  const bildeHtml = e.bilder && e.bilder.length ? e.bilder.map(b => `
    <figure>
      <img src="${b.fil}" alt="${e.navn || e.adresse || ''}" loading="lazy">
      ${(b.kreditering || b.rettigheter) ? `<figcaption>${
        [b.kreditering, b.rettigheter].filter(Boolean).join(' · ')
      }${b.beskrivelse ? ' — ' + b.beskrivelse : ''}</figcaption>` : ''}
    </figure>`).join('') : '';

  const historie = e.historie ? `
    <div class="historie">${e.historie.split('\n\n').map(a => `<p>${a}</p>`).join('')}</div>` : '';

  /* Bygningsbeskrivelse fra eiendommer.json */
  const byg = e.bygning || {};
  const husbeskrivelse = [
    byg.hustype,
    byg.etasjer ? byg.etasjer + (String(byg.etasjer) === '1' ? ' etasje' : ' etasjer') : null,
    byg.leiligheter ? byg.leiligheter + (String(byg.leiligheter) === '1' ? ' leilighet' : ' leiligheter') : null
  ].filter(Boolean).join(' · ');

  /* Nummerlinjen: henter fra eiendommer.matrikkel_1901 og parsell-properties */
  const mat = e.matrikkel_1901 || {};
  const nummerlinje = [
    p.id ? 'Løpenummer 1901: ' + p.id : null,
    mat.lopenr_1878 || p.lopenr_1878 ? 'Løpenr. 1878: ' + (mat.lopenr_1878 || p.lopenr_1878) : null,
    mat.matrikkelnr || p.matrikkel ? 'Matrikkel ' + (mat.matrikkelnr || p.matrikkel) : null,
    e.gnr_bnr || p.gnr_bnr ? 'Gnr/bnr ' + (e.gnr_bnr || p.gnr_bnr) : null
  ].filter(Boolean).join(' · ') || '—';

  const ft = e.folketelling_meta || {};
  /* Tittel-hierarki: navn > gate fra matrikkel > adresse > folketelling-adresse > løpenr */
  const tittel = e.navn || mat.gate || e.adresse || ft.adresse_historisk || ('Løpenummer ' + p.id);
  /* Undertittel: vis navnet hvis tittelen ble noe annet, eller gaten hvis tittelen ble navnet */
  const undertittel = (e.navn && mat.gate && e.navn !== mat.gate) ? mat.gate
                    : (!e.navn && e.adresse && e.adresse !== tittel) ? e.adresse : null;

  panel.innerHTML = `
    <h2 class="addr">${tittel}</h2>
    ${undertittel ? `<div class="navn">${undertittel}</div>` : ''}
    <div class="matr">${nummerlinje}</div>

    ${mat.eier || husbeskrivelse ? `
      <div class="hus">
        ${mat.eier ? `<div class="hus-type">Eier: ${mat.eier}</div>` : ''}
        ${husbeskrivelse ? `<div class="hus-type">${husbeskrivelse}</div>` : ''}
        ${mat.skattetakst ? `<div class="count">Skattetakst: ${mat.skattetakst.toLocaleString('nb')} kr${mat.brandtakst ? ' · Brandtakst: ' + mat.brandtakst.toLocaleString('nb') + ' kr' : ''}</div>` : ''}
        ${mat.anmerkning ? `<div class="count">${mat.anmerkning}</div>` : ''}
      </div>` : ''}

    ${bildeHtml}

    ${alle.length ? `
      <div class="hus">
        <div class="count">${alle.length} ${alle.length === 1 ? 'person' : 'personer'} i ${hh.length} ${hh.length === 1 ? 'husstand' : 'husstander'} · ${alle.length - barn} voksne, ${barn} barn</div>
      </div>
      ${hh.map((h,i) => husstandBlokk(h, i, hh.length)).join('')}
    ` : `<p class="ingen">Ingen beboere registrert på denne gården ennå.</p>`}

    ${historie}

    <div class="meta">
      ${d && d.kilde_url
        ? `Folketelling 1900 for 0101 Fredrikshald kjøpstad · <a href="${d.kilde_url}" target="_blank" rel="noopener">${d.kilde || 'Digitalarkivet'}</a>`
        : `Folketelling 1900 for 0101 Fredrikshald kjøpstad${d && d.kilde ? ' · ' + d.kilde : ''}`}
      · Arkivverket/Digitalarkivet<br>
      ${d && d.hentet ? `Data hentet ${d.hentet}<br>` : ''}
      ${[
        byg.sidebygninger ? 'Sidebygninger: ' + byg.sidebygninger : null,
        ft.krets ? 'Tellingskrets ' + ft.krets : null,
        ft.adresse_historisk ? 'I folketellingen: «' + ft.adresse_historisk + '»' : null
      ].filter(Boolean).join('<br>') + (byg.sidebygninger || ft.krets || ft.adresse_historisk ? '<br>' : '')}
      ${e.historie_kilde ? `Historikk: ${e.historie_kilde}<br>` : ''}
      Historisk kart 1905 ved O. Krum · ©Kartverket<br>
      <a href="mailto:${EPOST}?subject=${emne}">Meld feil på denne gården</a>
    </div>`;
}

/* Kartet er allerede rødt og gult, så konturene bruker lyshet framfor kulør:
   mørk strek med hvit casing under leser på gult papir, rød mur og blått vann. */
const stil   = {color:'#15181c',weight:1.2,opacity:.7,fillColor:'#15181c',fillOpacity:.06};
const valgt  = {color:'#15181c',weight:2.6,opacity:1,fillColor:'#e0a33c',fillOpacity:.30};
const dimmet = {color:'#15181c',weight:.8,opacity:.2,fillColor:'#15181c',fillOpacity:.02};
const treff  = {color:'#15181c',weight:2.2,opacity:1,fillColor:'#e0a33c',fillOpacity:.28};
let forrige = null, lag = null;

/* Hvit linje bak den valgte bygningen. Egen layer, ikke setStyle, siden
   Leaflet ikke kan tegne to strekbredder på samme polygon. */
let casing = null;
function settCasing(l){
  if (casing){ map.removeLayer(casing); casing = null; }
  if (!l) return;
  casing = L.polygon(l.getLatLngs(),
    {color:'#fff',weight:6,opacity:.9,fill:false,interactive:false}).addTo(map);
  l.bringToFront();
}

function tekstFor(id){
  const d = beboere[id];
  const e = eiendommer[id] || {};
  const personTekst = d ? d.husstander.flatMap(h => h.beboere)
    .map(b => (b.navn||'') + ' ' + (b.yrke||'')).join(' ') : '';
  const eierTekst = e.matrikkel_1901 ? (e.matrikkel_1901.eier || '') : '';
  return (personTekst + ' ' + eierTekst + ' ' + (e.navn || '')).toLowerCase();
}

async function start(){
  let geo, folk = {};
  try {
    geo = await (await fetch('parseller.geojson')).json();
  } catch(e) {
    panel.innerHTML = '<p class="empty">Fant ikke parseller.geojson. Filen må ligge ved siden av index.html, og siden må serveres over http (kjør <code>python -m http.server</code>), ikke åpnes direkte fra disk.</p>';
    return;
  }
  try { folk = await (await fetch('beboere.json')).json(); } catch(e) { /* valgfri */ }
  beboere = folk;
  try { eiendommer = await (await fetch('eiendommer.json')).json(); } catch(e) { /* valgfri */ }

  lag = L.geoJSON(geo,{
    style: stil,
    onEachFeature: (f,l) => {
      const p = f.properties;
      l.on('click', () => {
        if (forrige) forrige.setStyle(stil);
        l.setStyle(valgt); settCasing(l); forrige = l; vis(p);
      });
      l.on('mouseover', () => { if (l !== forrige) l.setStyle({fillOpacity:.32}); });
      l.on('mouseout',  () => { if (l !== forrige) l.setStyle(stil); });
      const e = eiendommer[p.id] || {};
      const ft = e.folketelling_meta || {};
      const mat = e.matrikkel_1901 || {};
      l.bindTooltip(e.navn || mat.gate || e.adresse || p.adresse || p.navn || ft.adresse_historisk || ('Løpenummer ' + p.id),
                    {direction:'top', opacity:.9});
    }
  }).addTo(map);

  map.fitBounds(lag.getBounds(), {padding:[30,30]});
}

document.getElementById('sok').addEventListener('input', e => {
  if (!lag) return;
  const q = e.target.value.trim().toLowerCase();
  document.body.classList.toggle('sok', !!q);   // demper kartet, så treffene løftes fram
  lag.eachLayer(l => {
    if (!q) { l.setStyle(l === forrige ? valgt : stil); return; }
    const p = l.feature.properties;
    const ei = eiendommer[p.id] || {};
    const eiMat = ei.matrikkel_1901 || {};
    const hay = tekstFor(p.id) + ' ' + (eiMat.gate||'') + ' ' + (ei.adresse||p.adresse||'') + ' ' + (ei.navn||p.navn||'');
    l.setStyle(hay.toLowerCase().includes(q) ? treff : dimmet);
  });
});

start();
</script>
</body>
</html>
